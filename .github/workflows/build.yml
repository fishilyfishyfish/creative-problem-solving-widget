name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        shell: bash
        env:
          # 저장소 Settings → Secrets and variables → Actions에 NEIS_API_KEY를 넣으면 APK에 포함된다.
          # 없어도 빌드는 되고, 앱 안에서 인증키를 입력하면 된다.
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          {
            grep -E '^e: ' build.log | head -n 6
            grep -E -A1 ' FAILED$' build.log | grep -v '^--$' | head -n 4
            awk '/What went wrong/{f=1;c=0} f&&c<6{print;c++} /^\* Try:/{f=0}' build.log | head -n 6
          } | while IFS= read -r line; do
            [ -n "$line" ] || continue
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "APK는 이 실행 페이지 아래쪽 **Artifacts → app-debug**에서 받을 수 있음 (zip 안에 app-debug.apk)." >> "$GITHUB_STEP_SUMMARY"
