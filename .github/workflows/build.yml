name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Release를 만들기 위해 필요

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        shell: bash
        env:
          # 저장소 Settings → Secrets and variables → Actions에 NEIS_API_KEY를 넣으면 APK에 포함된다.
          # 없어도 빌드는 되고, 앱 안에서 인증키를 입력하면 된다.
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          {
            grep -E '^e: ' build.log | head -n 6
            grep -E -A1 ' FAILED$' build.log | grep -v '^--$' | head -n 4
            awk '/What went wrong/{f=1;c=0} f&&c<6{print;c++} /^\* Try:/{f=0}' build.log | head -n 6
          } | while IFS= read -r line; do
            [ -n "$line" ] || continue
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # main에 올라온 코드만 Release로 게시한다. 앱은 가장 최근 Release를 보고 업데이트한다.
      - name: Publish release
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cps-widget.apk
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$BUILD" cps-widget.apk \
            --target "$GITHUB_SHA" \
            --title "빌드 $BUILD" \
            --notes-file notes.txt \
            --latest

      - name: Summary
        if: success()
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "빌드 ${{ github.run_number }}을 Release로 게시함. 앱이 알아서 새 버전을 알려줌." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "처음 설치: https://github.com/${{ github.repository }}/releases/latest/download/cps-widget.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK는 이 실행 페이지 아래쪽 **Artifacts → app-debug**에서 받을 수 있음." >> "$GITHUB_STEP_SUMMARY"
          fi
